name: Validate Cimbria Website
on:
  push:
    branches: [main, feat/supabase-auth-live, feat/admin-password-login, feat/cup-score-admin-team-limit, feat/v5-cinematic-tv-emblems, feat/start-from-12-teams]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/cloud.js
          node --check js/app.js
          node --check js/tv.js
      - name: Check files and TV references
        run: |
          test -s index.html
          test -s tv.html
          test -s css/base.css
          test -s css/v2.css
          test -s css/cloud.css
          test -s css/tv.css
          test -s assets/background-bierpong.mp4
          test -s assets/zirkel-cimbria.png
          test -s supabase/functions/cimbria-register-team/index.ts
          grep -q 'assets/background-bierpong.mp4' tv.html
          grep -q 'js/tv.js' tv.html
          grep -q 'cimbria_tv_control' js/cloud.js
          grep -q 'TEAM_ICONS' js/app.js
      - name: Validate all 12 team SVG crests
        run: |
          python3 -c 'import glob,xml.etree.ElementTree as ET; fs=glob.glob("assets/team-icons/*.svg"); assert len(fs)==12, len(fs); [ET.parse(p) for p in fs]; print("12 SVG crests: valid")'
      - name: Verify TV HTML element IDs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('tv.html','utf8');
          const script = fs.readFileSync('js/tv.js','utf8');
          const refs = [...script.matchAll(/\$\("([a-z0-9-]+)"\)/g)].map(m => m[1]);
          const missing = [...new Set(refs)].filter(id => !html.includes('id="' + id + '"'));
          assert.deepEqual(missing, [], 'Missing DOM nodes: ' + missing.join(','));
          console.log('TV DOM references: valid');
          NODE

      - name: Check 12-team group and playoff support
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const app = fs.readFileSync('js/app.js','utf8');
          const cloud = fs.readFileSync('js/cloud.js','utf8');
          assert(app.includes('state.teams.length<MIN_TEAMS()'), 'Start button must use minimum team count');
          assert(app.includes('state.teams.length < 16 ? 4 : 8'), 'Four-group format at 12–15 teams');
          assert(app.includes('round:small?1:0'), 'Eight-player bracket must start at quarterfinals');
          assert(app.includes('const ROUND_SLOTS_8='), 'Missing compact bracket labels');
          assert(cloud.includes('groups.slice(0,t.group_count)'), 'Supabase adapter must omit inactive groups');
          assert(cloud.includes('minTeams:12'), 'Fallback minimum must be 12');
          console.log('12-team format checks passed.');
          NODE
