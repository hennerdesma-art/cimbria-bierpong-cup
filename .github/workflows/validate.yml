name: Validate Cimbria Website
on:
  push:
    branches: [main, feat/supabase-auth-live, feat/admin-password-login, feat/cup-score-admin-team-limit, feat/v5-cinematic-tv-emblems, feat/start-from-12-teams, feat/admin-tournament-reset, feat/spielregeln-web-pdf-tv, fix/live-tv-animation-delivery]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/cloud.js
          node --check js/app.js
          node --check js/tv.js
      - name: Check files and TV references
        run: |
          test -s index.html
          test -s tv.html
          test -s css/base.css
          test -s css/v2.css
          test -s css/cloud.css
          test -s css/tv.css
          test -s assets/background-bierpong.mp4
          test -s assets/zirkel-cimbria.png
          test -s supabase/functions/cimbria-register-team/index.ts
          grep -q 'assets/background-bierpong.mp4' tv.html
          grep -q 'js/tv.js' tv.html
          grep -q 'cimbria_tv_control' js/cloud.js
          grep -q 'TEAM_ICONS' js/app.js
      - name: Validate all 12 team SVG crests
        run: |
          python3 -c 'import glob,xml.etree.ElementTree as ET; fs=glob.glob("assets/team-icons/*.svg"); assert len(fs)==12, len(fs); [ET.parse(p) for p in fs]; print("12 SVG crests: valid")'
      - name: Verify TV HTML element IDs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('tv.html','utf8');
          const script = fs.readFileSync('js/tv.js','utf8');
          const refs = [...script.matchAll(/\$\("([a-z0-9-]+)"\)/g)].map(m => m[1]);
          const missing = [...new Set(refs)].filter(id => !html.includes('id="' + id + '"'));
          assert.deepEqual(missing, [], 'Missing DOM nodes: ' + missing.join(','));
          console.log('TV DOM references: valid');
          NODE

      - name: Check 12-team group and playoff support
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const app = fs.readFileSync('js/app.js','utf8');
          const cloud = fs.readFileSync('js/cloud.js','utf8');
          assert(app.includes('state.teams.length<MIN_TEAMS()'), 'Start button must use minimum team count');
          assert(app.includes('state.teams.length < 16 ? 4 : 8'), 'Four-group format at 12–15 teams');
          assert(app.includes('round:small?1:0'), 'Eight-player bracket must start at quarterfinals');
          assert(app.includes('const ROUND_SLOTS_8='), 'Missing compact bracket labels');
          assert(cloud.includes('groups.slice(0,t.group_count)'), 'Supabase adapter must omit inactive groups');
          assert(cloud.includes('minTeams:12'), 'Fallback minimum must be 12');
          console.log('12-team format checks passed.');
          NODE

      - name: Validate head-admin reset integration
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const app = fs.readFileSync('js/app.js','utf8');
          const cloud = fs.readFileSync('js/cloud.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          assert(app.includes('id="cimbria-reset-form"'));
          assert(app.includes('CIMBRIA RESET'));
          assert(app.includes("case 'reset-download'"));
          assert(app.includes("case 'reset-open'"));
          assert(app.includes('CLOUD.canManageMembers'));
          assert(app.includes('CLOUD.resetTournament(confirmation,expected)'));
          assert(cloud.includes('p_expected_revision: expectedRevision'));
          assert(cloud.includes('p_confirmation: confirmation'));
          assert(html.includes('reset-v6-20261020'));
          console.log('Admin reset UI and RPC integration: passed');
          NODE

      - name: Check public rules page, PDF and live TV cue
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const info = fs.readFileSync('js/app.js','utf8');
          const web = fs.readFileSync('regeln.html','utf8');
          const tv = fs.readFileSync('tv.html','utf8');
          const engine = fs.readFileSync('js/tv.js','utf8');
          const pdf = fs.readFileSync('assets/Cimbria_Bierpong_Cup_Spielregeln.pdf');
          assert.equal(pdf.subarray(0,5).toString('ascii'),'%PDF-');
          assert(pdf.length>3500,'PDF file unexpectedly empty');
          assert.equal((web.match(/class="rule-card"/g)||[]).length,8);
          assert.equal((tv.match(/class="tv-rule-card"/g)||[]).length,8);
          assert(info.includes('data-kind="rules"'),'Admin TV-rules action missing');
          assert(info.includes('regeln.html'),'Infos page link missing');
          assert(engine.includes('kind!=="rules"'),'Persistent TV rules logic missing');
          assert(fs.existsSync('supabase/migrations/20261023162839_cimbria_tv_show_official_rules_on_demand.sql'));
          console.log('Rules web page, PDF download and TV controls: valid.');
          NODE

      - name: Test TV cue delivery and preview recovery
        run: |
          node tests/tv-cue-delivery.test.cjs
