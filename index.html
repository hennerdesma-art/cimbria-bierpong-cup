<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120810">
  <meta name="description" content="Cimbria Bierpong Cup – Team anmelden, Live-Begegnungen verfolgen und den Weg zum Finale erleben.">
  <title>Cimbria Bierpong Cup | Mehr als ein Spiel</title>
  <link rel="icon" type="image/png" href="assets/zirkel-cimbria.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/v2.css">
  <link rel="stylesheet" href="css/cloud.css?v=reset-v6-20261020">
</head>
<body>
  <div class="cinematic-backdrop" aria-hidden="true">
    <video id="ambient-video" class="cinematic-video" poster="assets/background-poster.jpg" autoplay muted playsinline loop preload="metadata" disablepictureinpicture>
      <source src="assets/background-bierpong.mp4" type="video/mp4">
    </video>
    <div class="cinematic-gradient"></div>
    <div class="cinematic-glow"></div>
  </div>
  <a href="#content" class="skip-link">Zum Inhalt springen</a>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="js/cloud.js?v=reset-v6-20261020" defer></script>
  <script src="js/app.js?v=reset-v6-20261020" defer></script>
  <script>
    (() => {
      const video = document.getElementById('ambient-video');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      function syncVideo() {
        if (document.hidden || reduced.matches) video.pause();
        else { const result = video.play(); if (result && typeof result.catch === 'function') result.catch(() => {}); }
      }
      document.addEventListener('visibilitychange', syncVideo);
      if (reduced.addEventListener) reduced.addEventListener('change', syncVideo);
      syncVideo();
    })();
  </script>
</body>
</html>
